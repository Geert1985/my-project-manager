<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>My Projects</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>My Projects</h1>
    <div class="topbar-actions">
      <nav class="top-nav" aria-label="Hoofdnavigatie">
        <button data-view="dashboard" class="nav-btn active">🏠 Home</button>
        <button data-view="tasks" class="nav-btn">📋 Taken</button>
        <button data-view="protocols" class="nav-btn">✓ Protocollen</button>
      </nav>
      <button id="newProjectBtn" class="primary">＋ Project</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <nav class="bottom-nav" aria-label="Hoofdnavigatie">
    <button data-view="dashboard" class="nav-btn active">🏠<span>Home</span></button>
    <button data-view="tasks" class="nav-btn">📋<span>Taken</span></button>
    <button data-view="protocols" class="nav-btn">✓<span>Protocollen</span></button>
  </nav>

  <dialog id="projectDialog">
    <form method="dialog" id="projectForm">
      <h2>Nieuw project</h2>
      <label>Naam<input id="projectName" required maxlength="100"></label>
      <label>Beschrijving<textarea id="projectDescription" rows="3"></textarea></label>
      <label>Categorie<input id="projectCategory" placeholder="Bijv. Studie, Privé, Werk"></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Aanmaken</button>
      </div>
    </form>
  </dialog>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h2 id="taskDialogTitle">Nieuwe taak</h2>
      <input type="hidden" id="taskParentId">
      <label>Naam<input id="taskName" required maxlength="150"></label>
      <label>Beschrijving<textarea id="taskDescription" rows="3"></textarea></label>
      <label>Prioriteit
        <select id="taskPriority">
          <option value="normal">Normaal</option>
          <option value="high">Hoog</option>
          <option value="low">Laag</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Toevoegen</button>
      </div>
    </form>
  </dialog>

  <dialog id="sourceDialog">
    <form method="dialog" id="sourceForm">
      <h2>Nieuwe bron</h2>
      <input type="hidden" id="sourceTaskId">
      <label>Titel<input id="sourceTitle" required maxlength="200"></label>
      <label>Type
        <select id="sourceType">
          <option value="document">Document</option>
          <option value="book">Boek</option>
          <option value="article">Artikel</option>
          <option value="website">Website</option>
          <option value="github">GitHub</option>
          <option value="other">Andere</option>
        </select>
      </label>
      <label>Auteur<input id="sourceAuthor" maxlength="150"></label>
      <label>Uitgever<input id="sourcePublisher" maxlength="150"></label>
      <label>URL<input id="sourceUrl" type="url"></label>
      <label>Beschrijving<textarea id="sourceDescription" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Bron toevoegen</button>
      </div>
    </form>
  </dialog>

  <dialog id="sourceVersionDialog">
    <form method="dialog" id="sourceVersionForm">
      <h2>Nieuwe bronversie</h2>
      <input type="hidden" id="sourceVersionSourceId">
      <label>Versie<input id="sourceVersion" required maxlength="50" placeholder="Bijv. 1.0"></label>
      <label>Label<input id="sourceVersionLabel" maxlength="150" placeholder="Bijv. Eerste gecontroleerde versie"></label>
      <label>Bestandsnaam<input id="sourceVersionFileName" maxlength="200"></label>
      <label>Bestandspad<input id="sourceVersionFilePath" maxlength="300"></label>
      <label>URL<input id="sourceVersionUrl" type="url"></label>
      <label>Notities<textarea id="sourceVersionNotes" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Versie toevoegen</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/projects.js"></script>
  <dialog id="reviewDialog">
    <form method="dialog" id="reviewForm">
      <h2>Nieuwe review</h2>
      <input type="hidden" id="reviewCheckId">
      <label>Reviewer<input id="reviewReviewer" required maxlength="150"></label>
      <label>Commentaar<textarea id="reviewComment" rows="4"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Review aanmaken</button>
      </div>
    </form>
  </dialog>

  <dialog id="protocolDialog">
    <form method="dialog" id="protocolForm">
      <h2>Nieuw controleprotocol</h2>
      <label>Naam<input id="protocolName" required maxlength="150"></label>
      <label>Versie<input id="protocolVersion" required maxlength="50" value="1.0"></label>
      <label>Beschrijving<textarea id="protocolDescription" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Protocol aanmaken</button>
      </div>
    </form>
  </dialog>

  <dialog id="checkDialog">
    <form method="dialog" id="checkForm">
      <h2>Nieuwe controle</h2>
      <input type="hidden" id="checkTaskId">
      <label>Protocol
        <select id="checkProtocolId" required></select>
      </label>
      <label>Bronversie
        <select id="checkSourceVersionId" required></select>
      </label>
      <label>Samenvatting<textarea id="checkSummary" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Controle starten</button>
      </div>
    </form>
  </dialog>

  <dialog id="protocolItemDialog">
    <form method="dialog" id="protocolItemForm">
      <h2>Nieuw controlepunt</h2>
      <input type="hidden" id="protocolItemProtocolId">
      <label>Titel<input id="protocolItemTitle" required maxlength="200"></label>
      <label>Beschrijving<textarea id="protocolItemDescription" rows="3"></textarea></label>
      <label><input type="checkbox" id="protocolItemRequired" checked> Verplicht controlepunt</label>
      <div class="dialog-actions">
        <button value="cancel">Annuleren</button>
        <button value="default" class="primary">Toevoegen</button>
      </div>
    </form>
  </dialog>

  <script src="js/sources.js"></script>
  <script src="js/protocols.js"></script>
  <script src="js/checks.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
